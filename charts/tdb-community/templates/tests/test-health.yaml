apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tdb.fullname" . }}-test-health
  labels:
    {{- include "tdb.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      command:
        - python
        - -c
        - "import urllib.request; print(urllib.request.urlopen('http://{{ include "tdb.fullname" . }}:{{ .Values.service.port }}/health').read().decode())"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
