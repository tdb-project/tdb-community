{{- if and (not .Values.apiKey.existingSecret) (not .Values.apiKey.value) }}
{{- fail "Set apiKey.existingSecret (recommended) or apiKey.value. TDB will not start with the public default key." }}
{{- end }}
{{- if and .Values.apiKey.existingSecret .Values.apiKey.value }}
{{- fail "Set only one of apiKey.existingSecret and apiKey.value." }}
{{- end }}
{{- if not .Values.apiKey.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tdb.fullname" . }}
  labels:
    {{- include "tdb.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.apiKey.value | quote }}
{{- end }}
