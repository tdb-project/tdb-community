name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check formatting
        run: uv run ruff format --check src/ tests/

      - name: Run linter
        run: uv run ruff check src/ tests/

      - name: Dependency CVE scan
        # Audit only our pinned runtime deps, not the CI environment's pip/setuptools
        run: uv run pip-audit -r requirements.txt

      - name: Python SAST (bandit)
        run: uv run bandit -r src/ -ll

      - name: Check CHANGELOG documents the current version
        # Silent during ordinary work — __version__ still points at the last
        # released version — and fires the moment a release bump lands without
        # a changelog entry.
        run: uv run python scripts/check_changelog.py

      - name: Run tests
        # No env vars needed — tests/conftest.py sets TDB_API_KEYS,
        # TDB_REGISTRY_DB, and TDB_LOG_FILE before any tdb.* import.
        run: uv run pytest

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint and render the Helm chart
        run: |
          H="docker run --rm -v $PWD/charts:/charts -w /charts alpine/helm:3.16.2"
          $H lint tdb-community --set apiKey.value=ci
          $H template t tdb-community --set apiKey.value=ci > /dev/null
          # The chart must refuse to render without a key rather than fall back to the public default.
          if $H template t tdb-community > /dev/null 2>&1; then echo "chart rendered without an API key"; exit 1; fi

      - name: Chart appVersion matches the release
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/tdb/__init__.py)
          grep -qx "appVersion: \"$v\"" charts/tdb-community/Chart.yaml \
            || { echo "charts/tdb-community/Chart.yaml appVersion is not $v"; exit 1; }
