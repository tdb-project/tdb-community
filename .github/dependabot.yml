version: 2
updates:
  # Keeps the SHA-pinned third-party actions in publish.yml current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # The base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
